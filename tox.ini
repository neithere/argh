[tox]
envlist =
    py39
    py310
    py311
    py312
    py313
    py314
    pypy3
    lint
    docs
skipdist = true
isolated_build = true
skip_missing_interpreters = true

[gh-actions]
# https://github.com/ymyzk/tox-gh-actions
python =
    3.9: py39
    3.10: py310
    3.11: py311,lint,as-module
    3.12: py312
    3.13: py313
    3.14: py314
    pypy-3.9: pypy3
    pypy-3.10: pypy3

[testenv]
description = run unit tests
extras = test
commands =
    python -m pytest --cov=argh --cov-report html --cov-fail-under 100 {posargs:tests}
setenv =
    PYTHONPATH=src

[testenv:docs]
description = build the HTML docs using sphinx-build
extras = docs
changedir = docs/
allowlist_externals = rm
commands =
    rm -rf docs/build
    sphinx-build . build --color -W --keep-going -n -b html {posargs}

[testenv:lint]
description = verify with linters
extras = linters
commands =
    pre-commit run -a
